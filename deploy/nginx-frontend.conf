# Nginx for Court Files React SPA (EC2).
# Install: sudo cp deploy/nginx-frontend.conf /etc/nginx/sites-available/court-files
#          sudo ln -sf /etc/nginx/sites-available/court-files /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx
#
# Replace app.yourdomain.com with your frontend hostname.
# After DNS points here:
#   sudo certbot --nginx -d app.yourdomain.com

server {
    listen 80;
    listen [::]:80;
    server_name app.yourdomain.com;

    root /var/www/court-files;
    index index.html;

    # Security headers (aligned with previous Vercel config)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Cache static assets from CRA build
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback — React Router
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Do not serve hidden files
    location ~ /\. {
        deny all;
    }
}
