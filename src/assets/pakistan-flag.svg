<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1280" viewBox="0 0 1920 1280" preserveAspectRatio="xMidYMid slice">
  <title>Pakistan flag green with black shade</title>
  <defs>
    <linearGradient id="greenBlack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#01411C"/>
      <stop offset="35%" stop-color="#012a12"/>
      <stop offset="70%" stop-color="#001508"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <radialGradient id="vignette" cx="42%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#0a5c32" stop-opacity="0.45"/>
      <stop offset="45%" stop-color="#01411C" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.85"/>
    </radialGradient>
    <linearGradient id="topShade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.35"/>
      <stop offset="40%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.55"/>
    </linearGradient>
  </defs>
  <rect width="1920" height="1280" fill="url(#greenBlack)"/>
  <rect width="1920" height="1280" fill="url(#vignette)"/>
  <rect width="1920" height="1280" fill="url(#topShade)"/>
</svg>
