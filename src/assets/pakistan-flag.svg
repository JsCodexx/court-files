<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1280" viewBox="0 0 1920 1280" preserveAspectRatio="xMidYMid slice">
  <title>Emerald green field</title>
  <defs>
    <linearGradient id="greenField" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F6B45"/>
      <stop offset="40%" stop-color="#0B5336"/>
      <stop offset="75%" stop-color="#083D28"/>
      <stop offset="100%" stop-color="#061F16"/>
    </linearGradient>
    <radialGradient id="vignette" cx="40%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#3DCF8E" stop-opacity="0.28"/>
      <stop offset="50%" stop-color="#0F6B45" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#04140E" stop-opacity="0.75"/>
    </radialGradient>
    <linearGradient id="topShade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#04140E" stop-opacity="0.25"/>
      <stop offset="45%" stop-color="#04140E" stop-opacity="0"/>
      <stop offset="100%" stop-color="#04140E" stop-opacity="0.4"/>
    </linearGradient>
  </defs>
  <rect width="1920" height="1280" fill="url(#greenField)"/>
  <rect width="1920" height="1280" fill="url(#vignette)"/>
  <rect width="1920" height="1280" fill="url(#topShade)"/>
</svg>
